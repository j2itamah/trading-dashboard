<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Analyst — V2 Operations</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Spline+Sans+Mono:wght@400;500;600&family=Spline+Sans:wght@400;500;600;700&display=swap');
  :root {
    --bg:#f4f3ee; --panel:#ffffff; --ink:#1a1d1a; --ink-soft:#6b7269;
    --line:#e4e2d8; --green:#1d9d6b; --green-bg:#e6f5ee; --red:#d6485a;
    --red-bg:#fbeaec; --accent:#3a5a78; --accent-bg:#eaf0f5; --gold:#c08a2d;
    --purple:#6d28d9; --purple-bg:#f3eefe;
    --shadow:0 1px 2px rgba(26,29,26,.04),0 8px 24px rgba(26,29,26,.05);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
    font-family:'Spline Sans',system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    padding:28px 22px 70px;
    background-image:radial-gradient(circle at 1px 1px,rgba(26,29,26,.025) 1px,transparent 0);
    background-size:22px 22px;
  }
  button,input{font:inherit}
  a{color:#2563eb;text-decoration:none}
  a:hover{text-decoration:underline}
  .wrap{max-width:1120px;margin:0 auto}
  .site-nav{display:flex;gap:6px;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);margin-bottom:24px;justify-content:center;position:sticky;top:8px;z-index:20}
  .nav-link{border:0;background:transparent;font-size:13px;font-weight:700;color:var(--ink-soft);border-radius:12px;padding:10px 20px;cursor:pointer;white-space:nowrap}
  .nav-link:hover{color:var(--ink)}
  .nav-link.on{background:var(--accent);color:#fff}
  header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
  .title-block h1{font-family:'Fraunces',serif;font-size:34px;font-weight:600;letter-spacing:-.5px;display:flex;gap:12px;align-items:center;margin:0}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px var(--green-bg)}
  .sub-h{font:500 13px/1.5 'Spline Sans Mono',monospace;color:var(--ink-soft);margin-top:5px}
  .updated{text-align:right;font:12px/1.35 'Spline Sans Mono',monospace;color:var(--ink-soft)}
  .updated strong{display:block;color:var(--ink);font-size:13px}
  .refresh-btn{border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer;margin-top:6px}
  .refresh-btn:hover{border-color:var(--accent);color:var(--accent)}
  .snapshot-warning{display:none;margin:0 0 18px;padding:11px 14px;border:1px solid #e7c46a;border-radius:10px;background:#fff8e5;color:#7a5610;font:600 12px/1.45 'Spline Sans Mono',monospace}
  .lab-warning,.vol-warning{margin:0 0 18px;padding:12px 14px;border-radius:12px;font:600 12px/1.45 'Spline Sans Mono',monospace}
  .lab-warning{border:1px solid #d97706;background:#fffbeb;color:#92400e}
  .vol-warning{border:1px solid #ddd6fe;background:var(--purple-bg);color:var(--purple)}
  .view{display:none}
  .view.on{display:block}
  .equity-summary{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;margin:0 0 18px}
  .eq-card,.panel,.kpi{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
  .eq-card{padding:22px 24px}
  .eq-label,.label,.panel h2{font:700 11px/1 'Spline Sans Mono',monospace;text-transform:uppercase;letter-spacing:1.2px;color:var(--ink-soft)}
  .eq-equity{font-family:'Fraunces',serif;font-size:clamp(30px,5vw,44px);font-weight:600;letter-spacing:-1px;line-height:1.05;margin-top:7px}
  .eq-growth{font:700 14px/1.4 'Spline Sans Mono',monospace;margin-top:8px}
  .split-bar{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:14px 0 12px;background:var(--line)}
  .split-bar .cash{background:linear-gradient(90deg,var(--green),#3bbd8a)}
  .split-bar .inv{background:linear-gradient(90deg,var(--accent),#5b7e9e)}
  .split-legend{display:flex;justify-content:space-between;gap:14px;font-size:12px}
  .split-legend .k{display:block;font:700 10.5px/1.2 'Spline Sans Mono',monospace;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-soft);margin-bottom:4px}
  .split-legend .v{font-weight:700;font-size:15px}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
  .kpi{padding:18px 20px;overflow:hidden}
  .kpi .value{font-family:'Fraunces',serif;font-size:clamp(23px,4vw,36px);font-weight:600;letter-spacing:-.8px;line-height:1.05;margin-top:8px;overflow-wrap:anywhere}
  .kpi .sub{font:12px/1.35 'Spline Sans Mono',monospace;color:var(--ink-soft);margin-top:8px}
  .grid{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;margin-top:18px}
  .three-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
  .panel{padding:22px}
  .panel h2{margin:0 0 16px;display:flex;align-items:center;gap:8px}
  .panel h2:before{content:'';width:6px;height:6px;border-radius:50%;background:var(--gold)}
  .exit-switch-wrap{display:flex;justify-content:center;margin:4px 0 16px}
  .exit-switch{position:relative;display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;box-shadow:var(--shadow)}
  .exit-switch .thumb{position:absolute;top:4px;left:4px;height:calc(100% - 8px);width:calc(50% - 4px);background:var(--accent);border-radius:9px;transition:transform .22s cubic-bezier(.4,0,.2,1);box-shadow:0 1px 3px rgba(58,90,120,.35)}
  .exit-switch.eod .thumb{transform:translateX(100%)}
  .exit-switch button{position:relative;z-index:1;border:none;background:transparent;font-weight:700;font-size:13px;color:var(--ink-soft);padding:9px 26px;cursor:pointer;border-radius:9px;white-space:nowrap;min-width:120px}
  .exit-switch button.on{color:#fff}
  .portfolio-toggle{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:6px;box-shadow:var(--shadow);margin:0 auto 18px;max-width:100%}
  .toggle-btn{font-size:13px;font-weight:700;color:var(--ink-soft);background:transparent;border:none;border-radius:999px;padding:8px 16px;cursor:pointer;white-space:nowrap}
  .toggle-btn.on{background:var(--accent-bg);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .toggle-btn.disabled{opacity:.4;cursor:not-allowed}
  .model-section{text-align:center;margin:20px 0 18px}
  .model-section-label{font:700 10px/1 'Spline Sans Mono',monospace;text-transform:uppercase;letter-spacing:1.8px;color:var(--ink-soft);margin-bottom:10px}
  .model-cards{display:inline-flex;gap:10px}
  .model-card{display:flex;align-items:center;gap:9px;padding:10px 20px;border-radius:14px;border:1.5px solid var(--line);background:var(--panel);cursor:pointer;transition:all .18s ease;font-weight:700;font-size:13px;color:var(--ink-soft);box-shadow:var(--shadow);position:relative}
  .model-card.on.fixed{border-color:var(--accent);background:var(--accent-bg);color:var(--accent)}
  .model-card.on.volatility{border-color:var(--purple);background:var(--purple-bg);color:var(--purple)}
  .pilot-tag{position:absolute;top:-8px;right:-6px;font:700 8px/1 'Spline Sans Mono',monospace;background:var(--purple);color:#fff;padding:3px 7px;border-radius:6px;letter-spacing:.4px}
  #active-label{text-align:center;font:12px/1.5 'Spline Sans Mono',monospace;color:var(--ink-soft);margin:12px 0 22px}
  #active-label strong{font:700 14px/1.2 'Spline Sans',sans-serif;color:var(--ink)}
  .pos-text{color:var(--green)} .neg-text{color:var(--red)} .zero-text{color:var(--ink-soft)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:none}
  .name{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .tag,.badge{font:700 10px/1 'Spline Sans Mono',monospace;padding:4px 8px;border-radius:7px;letter-spacing:.3px;border:1px solid var(--line);background:var(--accent-bg);color:var(--accent)}
  .badge.long,.badge.good{background:var(--green-bg);color:var(--green);border-color:#b8e2cc}
  .badge.short,.badge.bad{background:var(--red-bg);color:var(--red);border-color:#e8a0a8}
  .badge.vol{background:var(--purple-bg);color:var(--purple);border-color:#ddd6fe}
  .badge.warn{background:#fff8e5;color:#7a5610;border-color:#e7c46a}
  .metrics{display:flex;gap:18px;align-items:center}
  .metric{text-align:right}
  .m-val{font:700 14px/1.2 'Spline Sans Mono',monospace}
  .m-lab{font-size:10px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
  .pos-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .pos-row:hover{background:rgba(0,0,0,.025)}
  .pos-row:last-child{border-bottom:none}
  .asset-line{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pos-meta{font:12px/1.5 'Spline Sans Mono',monospace;color:var(--ink-soft);margin-top:4px}
  .pos-pnl{text-align:right;font-weight:800}
  .mini-track{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:7px}
  .mini-track span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--green),var(--gold))}
  .closed-toggle{background:none;border:1px solid var(--line);border-radius:10px;padding:10px 16px;width:100%;text-align:left;cursor:pointer;font-weight:700;font-size:13px;color:var(--ink-soft);margin:12px 0 10px;display:flex;justify-content:space-between;align-items:center}
  .trade-search{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;font-size:13px;margin-bottom:10px;outline:none;background:var(--bg)}
  .empty{padding:18px;border:1px dashed var(--line);border-radius:12px;color:var(--ink-soft);font:13px/1.5 'Spline Sans Mono',monospace;background:rgba(255,255,255,.45)}
  .lat-row,.signal-row,.x-row{padding:12px 0;border-bottom:1px solid var(--line)}
  .lat-row:last-child,.signal-row:last-child,.x-row:last-child{border-bottom:none}
  .headline{font-weight:700;line-height:1.35}
  .small{font:12px/1.45 'Spline Sans Mono',monospace;color:var(--ink-soft)}
  .tm-overlay{position:fixed;inset:0;background:rgba(20,22,28,.55);display:none;align-items:flex-start;justify-content:center;z-index:9999;overflow-y:auto;padding:40px 16px}
  .tm-overlay.open{display:flex}
  .tm-modal{background:var(--panel);border-radius:16px;max-width:720px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.28);overflow:hidden}
  .tm-head{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
  .tm-head h3{margin:0;font-size:24px;letter-spacing:-.01em}
  .tm-sub{font:12px/1.4 'Spline Sans Mono',monospace;color:var(--ink-soft);margin-top:2px;text-transform:uppercase;letter-spacing:.06em}
  .tm-close{background:none;border:none;font-size:26px;line-height:1;cursor:pointer;color:var(--ink-soft);padding:4px 8px;border-radius:8px}
  .tm-close:hover{background:rgba(0,0,0,.06)}
  .tm-body{padding:20px 24px}
  .tm-cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .tm-section{margin-bottom:18px}
  .tm-section h4{margin:0 0 10px;font:700 11px/1 'Spline Sans Mono',monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft)}
  .tm-kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:13px;border-bottom:1px dashed var(--line)}
  .tm-kv .k{color:var(--ink-soft)}
  .tm-kv .v{font-weight:700;text-align:right}
  .tm-pnl-banner{margin:0 0 16px;padding:14px 16px;border-radius:12px;text-align:center;font-size:24px;font-weight:800}
  .tm-pnl-banner.pos-text{background:var(--green-bg)}
  .tm-pnl-banner.neg-text{background:var(--red-bg)}
  .tm-pnl-banner.zero-text{background:#f3f3f3}
  .tm-foot{padding:14px 24px;border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap}
  .tm-btn{font-size:13px;padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:var(--panel);cursor:pointer}
  @media(max-width:760px){
    body{padding:20px 14px 76px}
    .site-nav{position:fixed;bottom:0;left:0;right:0;top:auto;border-radius:0;margin:0;border-left:0;border-right:0;border-bottom:0;background:var(--panel)}
    .nav-link{flex:1;padding:12px 6px}
    header{align-items:flex-start}
    .title-block h1{font-size:28px}
    .updated{text-align:left}
    .equity-summary,.grid,.three-grid{grid-template-columns:1fr}
    .kpis{grid-template-columns:repeat(2,1fr)}
    .portfolio-toggle{border-radius:14px}
    .toggle-btn{flex:1 1 30%;text-align:center;font-size:12px;padding:9px 8px}
    .exit-switch button{padding:9px 16px;min-width:104px}
    .model-card{padding:9px 14px;font-size:12px}
    .metrics{gap:10px;flex-wrap:wrap;justify-content:flex-end}
    .pos-row{grid-template-columns:1fr}
    .pos-pnl{text-align:left}
    .tm-overlay{padding:0}
    .tm-modal{border-radius:0;max-width:100%;min-height:100vh;min-height:100dvh}
    .tm-cols{grid-template-columns:1fr}
    .tm-head,.tm-body,.tm-foot{padding-left:18px;padding-right:18px}
  }
  @media(max-width:390px){
    .kpi{padding:15px}
    .kpi .value{font-size:22px}
  }
</style>
</head>
<body>
<div class="wrap">
  <nav class="site-nav" aria-label="Dashboard views">
    <button class="nav-link" data-view="overview">Overview</button>
    <button class="nav-link" data-view="research">Research</button>
    <button class="nav-link on" data-view="operations">Operations</button>
  </nav>

  <header>
    <div class="title-block">
      <h1><span class="dot"></span>Trading Analyst</h1>
      <div class="sub-h">V2 ledger command view. Old dashboard feel, new ledger math.</div>
    </div>
    <div class="updated">
      <span>Last updated</span>
      <strong id="upd-date">—</strong>
      <button class="refresh-btn" id="refresh-btn">Refresh</button>
    </div>
  </header>

  <div class="snapshot-warning" id="snapshot-warning"></div>

  <section id="view-overview" class="view"></section>
  <section id="view-research" class="view"></section>
  <section id="view-operations" class="view on">
    <div class="exit-switch-wrap">
      <div class="exit-switch" id="exit-switch">
        <span class="thumb"></span>
        <button data-rule="hold_24hr" class="on">24hr Hold</button>
        <button data-rule="sell_eod">Early Exit</button>
      </div>
    </div>
    <div class="portfolio-toggle" id="portfolio-toggle"></div>
    <div class="model-section">
      <div class="model-section-label">Target Model</div>
      <div class="model-cards" id="model-cards">
        <button class="model-card fixed on" data-model="fixed">Fixed</button>
        <button class="model-card volatility" data-model="volatility">Volatility <span class="pilot-tag">PILOT</span></button>
      </div>
    </div>
    <div id="active-label"></div>
    <div id="operations-content"><div class="empty">Loading V2 data...</div></div>
  </section>
</div>

<div class="tm-overlay" id="tm-overlay" onclick="if(event.target===this)closeTradeModal()">
  <div class="tm-modal" id="tm-modal" role="dialog" aria-modal="true" aria-label="Trade details"></div>
</div>

<script>
let DATA=null;
let CURRENT_VIEW=localStorage.getItem('v2_old_view') || 'operations';
let sel={
  portfolio:localStorage.getItem('v2_old_portfolio') || 'news_only',
  lifecycle:localStorage.getItem('v2_old_lifecycle') || 'hold_24hr',
  model:localStorage.getItem('v2_old_model') || 'fixed'
};
let OPEN_EXPANDED=false, CLOSED_EXPANDED=false;
let OPEN_SEARCH='', CLOSED_SEARCH='';

const STRAT_LABELS={news_only:'News Only',news_plus_ta:'Trend Gate',mean_reversion:'Mean Revert',trend_strict:'Trend Strict',full_confluence:'Full Confluence',crypto_lab:'Crypto Lab'};
const LIFE_LABELS={hold_24hr:'24hr Hold',sell_eod:'Early Exit'};
const fmtMoney=n=>'$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtPrice=n=>n==null?'—':'$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:Math.abs(Number(n))<1?4:2,maximumFractionDigits:Math.abs(Number(n))<1?4:2});
const fmtPct=n=>(Number(n||0)>0?'+':'')+Number(n||0).toFixed(2)+'%';
const fmtInt=n=>Number(n||0).toLocaleString('en-US');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const signCls=n=>Number(n||0)>0?'pos-text':(Number(n||0)<0?'neg-text':'zero-text');
const shortTime=iso=>iso?new Date(iso).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'—';
const secondsLabel=s=>s==null?'—':(Math.abs(Number(s))<60?Math.round(Number(s))+'s':Math.round(Number(s)/60)+'m');
const rows=a=>Array.isArray(a)?a:[];
const officialBooks=()=>rows(DATA?.official_books).length?rows(DATA.official_books):rows(DATA?.prop_books).length?rows(DATA.prop_books):rows(DATA?.book_metrics);
const openPositions=()=>rows(DATA?.open_positions);
const closedTrades=()=>rows(DATA?.closed_trades);
const allTrades=()=>openPositions().concat(closedTrades());
function bookLabel(b){return `${STRAT_LABELS[b?.portfolio]||b?.portfolio||'Book'} · ${LIFE_LABELS[b?.lifecycle]||b?.lifecycle||'Lifecycle'} · ${(b?.target_model||'model')}`;}
function selectedBook(){return officialBooks().find(b=>(b.portfolio||'')===sel.portfolio && (b.lifecycle||'')===sel.lifecycle && (b.target_model||b.classification||'')===sel.model)}
function modelOf(r){return r.target_model||r.model||r.classification||'fixed'}
function pnlOf(t){return t.status==='CLOSED' ? Number(t.realized_pnl||0) : Number(t.computed_unrealized_pnl ?? t.unrealized_pnl ?? 0)}
function pctOf(t){return t.status==='CLOSED' ? Number(t.computed_realized_pnl_pct ?? (Number(t.realized_pnl_percent||0)*100)) : Number(t.computed_unrealized_pnl_pct ?? (Number(t.unrealized_pnl_percent||0)*100))}
function brokerLabel(s){return s==='paper_filled'?'Broker: paper filled':s==='submitted'?'Broker: submitted':s==='cancelled'?'Broker: cancelled':'Broker: not mirrored'}
function articleUrl(t){
  const sig=rows(DATA?.signals).find(s=>s.id===t.signal_id);
  return t.news_url || t.source_url || sig?.news_url || sig?.raw_payload?.source_url || t.raw_payload?.source_url || null;
}
function latencyFor(t){return rows(DATA?.latency).find(l=>l.v2_trade_intent_id===t.id || (l.signal_id===t.signal_id && l.asset===t.asset))}
function freshness(){
  const gen=DATA?.generated_at; if(!gen) return;
  const age=Math.max(0,Math.round((Date.now()-new Date(gen).getTime())/60000));
  document.getElementById('upd-date').textContent=new Date(gen).toLocaleString();
  const warn=document.getElementById('snapshot-warning');
  if(age>20){warn.style.display='block'; warn.textContent=`Data is ${age}m old. Pull/refresh if publisher has not updated yet.`}
  else {warn.style.display='none'}
}
function kpi(label,value,cls='',sub=''){return `<div class="kpi"><div class="label">${label}</div><div class="value ${cls}">${value}</div>${sub?`<div class="sub">${sub}</div>`:''}</div>`}
function equityBlock(summary){
  const start=Number(summary?.total_starting_balance||20000);
  const equity=Number(summary?.total_marked_equity||start);
  const deployed=Number(summary?.total_deployed_cost||0);
  const cash=Number(summary?.total_free_cash||0);
  const pnl=Number(summary?.total_since_start_pnl ?? summary?.total_official_since_baseline_pnl ?? (equity-start));
  const cashPct=Math.max(0,Math.min(100,(cash/(cash+deployed||1))*100));
  const invPct=Math.max(0,Math.min(100,100-cashPct));
  return `<div class="equity-summary">
    <div class="eq-card">
      <div class="eq-label">Official Marked Equity</div>
      <div class="eq-equity">${fmtMoney(equity)}</div>
      <div class="eq-growth ${signCls(pnl)}">${pnl>=0?'+':''}${fmtMoney(pnl)} total · ${fmtPct((pnl/(start||1))*100)}</div>
    </div>
    <div class="eq-card">
      <div class="eq-label">Cash / Deployed</div>
      <div class="split-bar"><span class="cash" style="width:${cashPct}%"></span><span class="inv" style="width:${invPct}%"></span></div>
      <div class="split-legend"><div><span class="k">Available Cash</span><span class="v">${fmtMoney(cash)}</span></div><div style="text-align:right"><span class="k">Deployed</span><span class="v">${fmtMoney(deployed)}</span></div></div>
    </div>
  </div>`;
}
function renderOverview(){
  const s=DATA?.official_summary||DATA?.prop_summary||{};
  const health=DATA?.health||{};
  const shadow=DATA?.shadow_health||{};
  const today=Number(s.total_today_marked_pnl_approx ?? s.total_today_realized_pnl ?? 0);
  const total=Number(s.total_since_start_pnl ?? s.total_official_since_baseline_pnl ?? 0);
  const target=Number((DATA?.prop_summary||{}).total_profit_target_dollars||2000);
  const progress=target?Math.max(0,Math.min(100,(total/target)*100)):0;
  let html=equityBlock(s);
  html+=`<div class="kpis">
    ${kpi('Today P/L', `${today>=0?'+':''}${fmtMoney(today)}`, signCls(today), 'Marked approximation')}
    ${kpi('Total P/L', `${total>=0?'+':''}${fmtMoney(total)}`, signCls(total), 'Since start/baseline')}
    ${kpi('Open Trades', fmtInt(s.total_open_count), '', `${fmtInt(s.total_closed_count)} closed`)}
    ${kpi('V2 Health', health.accounting_ok?'OK':'Check', health.accounting_ok?'pos-text':'neg-text', `${health.books_with_drift||0} drift books`)}
  </div>`;
  html+=`<div class="grid"><div class="panel"><h2>Prop Guardrails</h2>
    <div class="row"><div class="name">Profit Target</div><div class="metrics"><div class="metric"><div class="m-val">${fmtMoney(target)}</div><div class="m-lab">${progress.toFixed(1)}%</div></div></div></div>
    <div class="mini-track"><span style="width:${progress}%"></span></div>
    <div class="row"><div class="name">Daily Loss Buffer</div><div class="metrics"><div class="metric"><div class="m-val">${fmtMoney((DATA?.prop_summary||{}).total_max_daily_loss_dollars||1000)}</div><div class="m-lab">limit</div></div></div></div>
    <div class="row"><div class="name">Accounts</div><div class="metrics"><div class="metric"><div class="m-val">${fmtInt(s.account_count||2)}</div><div class="m-lab">${s.accounts_not_ok||0} not ok</div></div></div></div>
  </div><div class="panel"><h2>System</h2>
    <div class="row"><div class="name">Shadow Trigger</div><div class="metrics"><div class="metric"><div class="m-val ${shadow.shadow_status==='OK'?'pos-text':'neg-text'}">${esc(shadow.shadow_status||'—')}</div><div class="m-lab">${fmtInt(shadow.audit_success)} success</div></div></div></div>
    <div class="row"><div class="name">Close Mirror</div><div class="metrics"><div class="metric"><div class="m-val pos-text">${closedTrades().filter(t=>t.exit_time&&t.exit_price!=null).length}/${closedTrades().length}</div><div class="m-lab">closed mirrored</div></div></div></div>
    <div class="row"><div class="name">Marked Open</div><div class="metrics"><div class="metric"><div class="m-val">${openPositions().filter(t=>t.current_price_status==='ok'||t.current_price!=null).length}/${openPositions().length}</div><div class="m-lab">positions</div></div></div></div>
  </div></div>`;
  document.getElementById('view-overview').innerHTML=html;
}
function renderSelectors(){
  const books=officialBooks();
  const portfolios=[...new Set(books.map(b=>b.portfolio).filter(Boolean))];
  const pt=document.getElementById('portfolio-toggle');
  pt.innerHTML=portfolios.map(p=>`<button class="toggle-btn ${p===sel.portfolio?'on':''}" data-portfolio="${esc(p)}">${esc(STRAT_LABELS[p]||p)}</button>`).join('');
  const ex=document.getElementById('exit-switch');
  ex.className='exit-switch'+(sel.lifecycle==='sell_eod'?' eod':'');
  ex.querySelectorAll('button').forEach(b=>{const on=b.dataset.rule===sel.lifecycle;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});
  document.querySelectorAll('#model-cards .model-card').forEach(b=>{const on=b.dataset.model===sel.model;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});
}
function tradeRow(t){
  const pnl=pnlOf(t), pct=pctOf(t), dir=(t.direction||'').toUpperCase();
  const mark=t.current_price_status==='missing_mark'||t.current_price==null?'Waiting for mark':`Current ${fmtPrice(t.current_price)}`;
  const progress=Math.max(0,Math.min(100,Number(t.progress_to_target_pct||0)));
  return `<div class="pos-row" data-trade-id="${t.id}">
    <div>
      <div class="asset-line"><span>${esc(t.asset)}</span><span class="badge ${dir==='BUY'?'long':'short'}">${esc(dir)}</span><span class="badge ${modelOf(t)==='volatility'?'vol':''}">${esc(modelOf(t))}</span><span class="badge">${esc(t.lifecycle||'')}</span></div>
      <div class="pos-meta">Entry ${fmtPrice(t.entry_price)} · ${mark} · ${brokerLabel(t.broker_mirror_status)}</div>
      ${t.status==='OPEN' && t.current_price!=null?`<div class="mini-track"><span style="width:${progress}%"></span></div>`:''}
    </div>
    <div class="pos-pnl ${signCls(pnl)}">${pnl>=0?'+':''}${fmtMoney(pnl)}<div class="small">${fmtPct(pct)}</div></div>
  </div>`;
}
function renderOperations(){
  renderSelectors();
  const b=selectedBook();
  const active=document.getElementById('active-label');
  if(!b){
    active.innerHTML=`<strong>${esc(STRAT_LABELS[sel.portfolio]||sel.portfolio)} · ${esc(LIFE_LABELS[sel.lifecycle]||sel.lifecycle)} · ${esc(sel.model)}</strong><div>Book not deployed yet. This appears after book expansion.</div>`;
    document.getElementById('operations-content').innerHTML='<div class="empty">This book is not deployed in V2 yet.</div>';
    return;
  }
  active.innerHTML=`<strong>${bookLabel(b)}</strong><div>${esc(b.book_key)} · ${esc(b.prop_status||b.official_status||'ok')}</div>`;
  let html='';
  if(sel.portfolio==='crypto_lab') html+=`<div class="lab-warning">Crypto Lab is research-only and does not count toward official account totals.</div>`;
  if(sel.model==='volatility' && Number(b.open_count||0)===0){
    const recent=rows(DATA?.rejections).filter(r=>r.stage==='volatility_gate').slice(0,3).map(r=>(r.details&&r.details.asset)||'unknown').join(', ');
    html+=`<div class="vol-warning">Volatility is live, but this selected book has no open V2 positions yet. ATR-backed trades must show a real ATR source; missing ATR is rejected instead of falling back to fixed${recent?`. Recent ATR misses: ${esc(recent)}`:''}.</div>`;
  }
  html+=`<div class="equity-summary"><div class="eq-card"><div class="eq-label">Selected Book Equity</div><div class="eq-equity">${fmtMoney(b.marked_equity||b.equity||b.starting_balance)}</div><div class="eq-growth ${signCls(b.since_start_pnl)}">${Number(b.since_start_pnl||0)>=0?'+':''}${fmtMoney(b.since_start_pnl||0)} since start · ${fmtPct(Number(b.since_start_return||0)*100)}</div></div><div class="eq-card"><div class="eq-label">Today</div><div class="eq-equity ${signCls(b.today_marked_pnl_approx)}">${Number(b.today_marked_pnl_approx||0)>=0?'+':''}${fmtMoney(b.today_marked_pnl_approx||0)}</div><div class="eq-growth ${signCls(b.today_realized_pnl)}">${Number(b.today_realized_pnl||0)>=0?'+':''}${fmtMoney(b.today_realized_pnl||0)} realized</div></div></div>`;
  html+=`<div class="kpis">
    ${kpi('Open', fmtInt(b.open_count), '', `${fmtInt(b.today_opened_count)} opened today`)}
    ${kpi('Closed', fmtInt(b.closed_count), '', `${fmtInt(b.today_closed_count)} closed today`)}
    ${kpi('Unrealized', `${Number(b.unrealized_pnl||0)>=0?'+':''}${fmtMoney(b.unrealized_pnl||0)}`, signCls(b.unrealized_pnl))}
    ${kpi('Realized', `${Number(b.realized_pnl||0)>=0?'+':''}${fmtMoney(b.realized_pnl||0)}`, signCls(b.realized_pnl))}
  </div>`;
  const bookOpen=openPositions().filter(t=>t.book_key===b.book_key);
  const bookClosed=closedTrades().filter(t=>t.book_key===b.book_key);
  const openFiltered=bookOpen.filter(t=>`${t.asset} ${t.direction} ${t.broker_mirror_status}`.toLowerCase().includes(OPEN_SEARCH.toLowerCase()));
  const closedFiltered=bookClosed.filter(t=>`${t.asset} ${t.direction} ${t.exit_reason}`.toLowerCase().includes(CLOSED_SEARCH.toLowerCase()));
  html+=`<div class="grid"><div class="panel"><h2>Open Positions</h2>`;
  if(!bookOpen.length) html+='<div class="empty">No open positions for this selected book.</div>';
  else {
    if(OPEN_EXPANDED) html+=`<input class="trade-search" id="open-search" placeholder="Search open positions..." value="${esc(OPEN_SEARCH)}">`;
    html+=(OPEN_EXPANDED?openFiltered:bookOpen.slice(0,6)).map(tradeRow).join('');
    if(bookOpen.length>6) html+=`<button class="closed-toggle" id="toggle-open"><span>${OPEN_EXPANDED?'Collapse':'Show all '+bookOpen.length+' positions'}</span><span>›</span></button>`;
  }
  html+=`</div><div class="panel"><h2>Closed Trades</h2>`;
  if(!bookClosed.length) html+='<div class="empty">No closed trades for this selected book.</div>';
  else {
    if(CLOSED_EXPANDED) html+=`<input class="trade-search" id="closed-search" placeholder="Search closed trades..." value="${esc(CLOSED_SEARCH)}">`;
    html+=(CLOSED_EXPANDED?closedFiltered:bookClosed.slice(0,6)).map(tradeRow).join('');
    if(bookClosed.length>6) html+=`<button class="closed-toggle" id="toggle-closed"><span>${CLOSED_EXPANDED?'Collapse':'Show all '+bookClosed.length+' trades'}</span><span>›</span></button>`;
  }
  html+='</div></div>';
  document.getElementById('operations-content').innerHTML=html;
}
function renderResearch(){
  const lat=rows(DATA?.latency).slice(0,12);
  const sigs=rows(DATA?.signals).slice(0,10);
  const x=rows(DATA?.crypto_lab_x).slice(0,8);
  const rej=rows(DATA?.rejections).filter(r=>r.stage==='volatility_gate').slice(0,8);
  let html=`<div class="lab-warning">Crypto Lab is research-only and does not count toward official account totals.</div>`;
  html+=`<div class="grid"><div class="panel"><h2>News-to-Trade Latency</h2>${lat.map(l=>`<div class="lat-row"><div class="headline">${esc(l.asset)} ${esc(l.direction)} · ${esc(l.source||'')}</div><div class="small">${esc(l.headline||'')}</div><div class="small">News to trade: ${secondsLabel(l.news_to_trade_seconds)} · Move before entry: ${l.price_move_before_entry_pct==null?'missing reference price':fmtPct(l.price_move_before_entry_pct)}</div>${l.news_url?`<a href="${esc(l.news_url)}" target="_blank" rel="noopener">Read original article</a>`:''}</div>`).join('')||'<div class="empty">No latency rows yet.</div>'}</div>`;
  html+=`<div class="panel"><h2>Volatility Rejections</h2>${rej.map(r=>`<div class="lat-row"><div class="headline">${esc((r.details&&r.details.asset)||'Unknown')} · ${esc(r.reason)}</div><div class="small">${shortTime(r.created_at)} · ATR ${esc((r.details&&r.details.atr_percent)||'missing')}</div></div>`).join('')||'<div class="empty">No recent volatility rejections.</div>'}</div></div>`;
  html+=`<div class="grid"><div class="panel"><h2>Signals</h2>${sigs.map(s=>`<div class="signal-row"><div class="headline">${esc(s.asset)} ${esc(s.direction)} · ${esc(s.source||'')}</div><div class="small">${esc(s.headline||'')}</div>${s.news_url?`<a href="${esc(s.news_url)}" target="_blank" rel="noopener">Read original article</a>`:''}</div>`).join('')||'<div class="empty">No signals yet.</div>'}</div>`;
  html+=`<div class="panel"><h2>Crypto Lab / X</h2>${x.map(e=>`<div class="x-row"><div class="headline">${esc((e.detected_assets||[]).join(', ')||'Crypto')} · @${esc(e.author_handle||'')}</div><div class="small">${esc(e.text_preview||e.raw_text||'')}</div><div class="small">Quality ${esc(e.source_quality_bucket||'unproven')} · latency ${secondsLabel(e.latency_seconds)}</div></div>`).join('')||'<div class="empty">No X events yet.</div>'}</div></div>`;
  document.getElementById('view-research').innerHTML=html;
}
function showView(v){
  CURRENT_VIEW=v; localStorage.setItem('v2_old_view',v);
  document.querySelectorAll('.nav-link').forEach(b=>b.classList.toggle('on',b.dataset.view===v));
  document.querySelectorAll('.view').forEach(s=>s.classList.toggle('on',s.id==='view-'+v));
}
function openTradeModal(id){
  const t=allTrades().find(x=>String(x.id)===String(id)); if(!t) return;
  const pnl=pnlOf(t), pct=pctOf(t), lat=latencyFor(t), url=articleUrl(t), dir=(t.direction||'').toUpperCase();
  const html=`<div class="tm-head"><div><h3>${esc(t.asset)} <span class="badge ${dir==='BUY'?'long':'short'}">${esc(dir)}</span> <span class="badge ${modelOf(t)==='volatility'?'vol':''}">${esc(modelOf(t))}</span></h3><div class="tm-sub">${esc(t.portfolio||'')} · ${esc(t.lifecycle||'')} · ${esc(t.status||'')}</div></div><button class="tm-close" onclick="closeTradeModal()">×</button></div>
  <div class="tm-body">
    <div class="tm-pnl-banner ${signCls(pnl)}">${pnl>=0?'+':''}${fmtMoney(pnl)}<div class="small">${fmtPct(pct)}</div></div>
    <div class="tm-cols">
      <div>
        <div class="tm-section"><h4>Trade</h4>${kv('Entry',fmtPrice(t.entry_price))}${kv('Current',t.current_price==null?'Waiting for mark':fmtPrice(t.current_price))}${kv('Exit',t.exit_price==null?'—':fmtPrice(t.exit_price))}${kv('Shares',Number(t.shares||0).toFixed(4))}${kv('Stake',fmtMoney(t.stake_amount))}</div>
        <div class="tm-section"><h4>Lifecycle TP/SL</h4>${kv(dir==='BUY'?'Take Profit (above entry)':'Take Profit (below entry)',fmtPrice(t.take_profit_price))}${kv(dir==='BUY'?'Stop Loss (below entry)':'Stop Loss (above entry)',fmtPrice(t.stop_loss_price))}${kv('Exit reason',t.exit_reason||'—')}${kv('Broker',brokerLabel(t.broker_mirror_status))}</div>
      </div>
      <div>
        <div class="tm-section"><h4>Volatility Model</h4>${kv('Model source',t.target_source||t.atr_source||'—')}${kv('ATR source',t.atr_source||t.target_source||'—')}${kv('ATR timestamp',t.atr_source_timestamp?shortTime(t.atr_source_timestamp):'—')}${kv('ATR value',t.atr_value??'—')}${kv('ATR percent',t.atr_percent==null?'—':fmtPct(t.atr_percent))}${kv('Vol stop',t.volatility_stop_percent==null?'—':fmtPct(t.volatility_stop_percent))}${kv('Vol target',t.volatility_target_percent==null?'—':fmtPct(t.volatility_target_percent))}</div>
        <div class="tm-section"><h4>Latency</h4>${kv('News to trade',secondsLabel(lat?.news_to_trade_seconds))}${kv('Captured to V2',secondsLabel(lat?.received_to_v2_shadow_seconds))}${kv('Move before entry',lat?.price_move_before_entry_pct==null?'Missing reference price':fmtPct(lat.price_move_before_entry_pct))}${kv('Entry time',shortTime(t.entry_time))}</div>
      </div>
    </div>
    <div class="tm-section"><h4>News</h4><div class="small">${esc(lat?.headline || rows(DATA?.signals).find(s=>s.id===t.signal_id)?.headline || 'No headline available')}</div>${url?`<p><a href="${esc(url)}" target="_blank" rel="noopener">Read original article</a></p>`:'<p class="small">Source link unavailable</p>'}</div>
  </div>
  <div class="tm-foot"><button class="tm-btn" onclick="closeTradeModal()">Close</button></div>`;
  document.getElementById('tm-modal').innerHTML=html;
  document.getElementById('tm-overlay').classList.add('open');
}
function kv(k,v){return `<div class="tm-kv"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`}
function closeTradeModal(){document.getElementById('tm-overlay').classList.remove('open')}
function bind(){
  document.querySelectorAll('.nav-link').forEach(b=>b.onclick=()=>showView(b.dataset.view));
  document.getElementById('refresh-btn').onclick=()=>load();
  document.getElementById('exit-switch').onclick=e=>{const b=e.target.closest('button'); if(!b) return; sel.lifecycle=b.dataset.rule; localStorage.setItem('v2_old_lifecycle',sel.lifecycle); renderOperations()};
  document.getElementById('model-cards').onclick=e=>{const b=e.target.closest('button'); if(!b) return; sel.model=b.dataset.model; localStorage.setItem('v2_old_model',sel.model); renderOperations()};
  document.addEventListener('click',e=>{
    const p=e.target.closest('[data-portfolio]'); if(p){sel.portfolio=p.dataset.portfolio; localStorage.setItem('v2_old_portfolio',sel.portfolio); renderOperations(); return}
    const tr=e.target.closest('[data-trade-id]'); if(tr){openTradeModal(tr.dataset.tradeId); return}
    if(e.target.closest('#toggle-open')){OPEN_EXPANDED=!OPEN_EXPANDED; renderOperations(); return}
    if(e.target.closest('#toggle-closed')){CLOSED_EXPANDED=!CLOSED_EXPANDED; renderOperations(); return}
  });
  document.addEventListener('input',e=>{if(e.target.id==='open-search'){OPEN_SEARCH=e.target.value; renderOperations()} if(e.target.id==='closed-search'){CLOSED_SEARCH=e.target.value; renderOperations()}});
  document.addEventListener('keydown',e=>{if(e.key==='Escape') closeTradeModal()});
}
function ensureValidSelection(){
  const books=officialBooks();
  if(!books.length) return;
  if(!books.some(b=>b.portfolio===sel.portfolio)) sel.portfolio=books[0].portfolio;
  if(!books.some(b=>b.portfolio===sel.portfolio && b.lifecycle===sel.lifecycle)) sel.lifecycle=books.find(b=>b.portfolio===sel.portfolio)?.lifecycle||'hold_24hr';
  if(!books.some(b=>b.portfolio===sel.portfolio && b.lifecycle===sel.lifecycle && b.target_model===sel.model)) sel.model=books.find(b=>b.portfolio===sel.portfolio && b.lifecycle===sel.lifecycle)?.target_model||'fixed';
}
function renderAll(){
  freshness(); ensureValidSelection(); renderOverview(); renderResearch(); renderOperations(); showView(CURRENT_VIEW);
}
async function load(){
  const res=await fetch('data.v2.json?ts='+Date.now(),{cache:'no-store'});
  if(!res.ok) throw new Error('Failed to load data.v2.json');
  DATA=await res.json();
  renderAll();
}
bind();
load().catch(err=>{
  document.getElementById('operations-content').innerHTML=`<div class="empty">Could not load data.v2.json: ${esc(err.message)}</div>`;
});
</script>
</body>
</html>
