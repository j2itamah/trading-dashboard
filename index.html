<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Analyst — V2 Operations</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Spline+Sans+Mono:wght@400;500;600&family=Spline+Sans:wght@400;500;600;700&display=swap');
  :root {
    --bg:#f4f3ee; --panel:#ffffff; --ink:#1a1d1a; --ink-soft:#6b7269;
    --line:#e4e2d8; --green:#1d9d6b; --green-bg:#e6f5ee; --red:#d6485a;
    --red-bg:#fbeaec; --accent:#3a5a78; --accent-bg:#eaf0f5; --gold:#c08a2d;
    --purple:#6d28d9; --purple-bg:#f3eefe;
    --shadow:0 1px 2px rgba(26,29,26,.04),0 8px 24px rgba(26,29,26,.05);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
    font-family:'Spline Sans',system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    padding:28px 22px 70px;
    background-image:radial-gradient(circle at 1px 1px,rgba(26,29,26,.025) 1px,transparent 0);
    background-size:22px 22px;
  }
  button,input{font:inherit}
  a{color:#2563eb;text-decoration:none}
  a:hover{text-decoration:underline}
  .wrap{max-width:1120px;margin:0 auto}
  .site-nav{display:flex;gap:6px;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);margin-bottom:24px;justify-content:center;position:sticky;top:8px;z-index:20}
  .nav-current{display:none;border:0;background:var(--accent);color:#fff;font-size:13px;font-weight:800;border-radius:12px;padding:11px 14px;cursor:pointer;width:100%;justify-content:space-between;align-items:center}
  .nav-current-main{display:inline-flex;align-items:center;gap:10px}
  .hamburger{display:inline-grid;gap:4px;width:18px}
  .hamburger i{display:block;height:2px;border-radius:999px;background:currentColor}
  .nav-menu-word{font:800 10px/1 'Spline Sans Mono',monospace;text-transform:uppercase;letter-spacing:.8px;opacity:.78}
  .nav-list{display:flex;gap:6px;justify-content:center;overflow-x:auto}
  .nav-link{border:0;background:transparent;font-size:13px;font-weight:700;color:var(--ink-soft);border-radius:12px;padding:10px 20px;cursor:pointer;white-space:nowrap}
  .nav-link:hover{color:var(--ink)}
  .nav-link.on{background:var(--accent);color:#fff}
  header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
  .title-block h1{font-family:'Fraunces',serif;font-size:34px;font-weight:600;letter-spacing:-.5px;display:flex;gap:12px;align-items:center;margin:0}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px var(--green-bg)}
  .sub-h{font:500 13px/1.5 'Spline Sans Mono',monospace;color:var(--ink-soft);margin-top:5px}
  .updated{text-align:right;font:12px/1.35 'Spline Sans Mono',monospace;color:var(--ink-soft)}
  .updated strong{display:block;color:var(--ink);font-size:13px}
  .updated.fresh strong{color:var(--green)}
  .updated.warn strong{color:var(--gold,#d97706)}
  .updated.stale strong{color:var(--red)}
  .refresh-btn{border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer;margin-top:6px}
  .refresh-btn:hover{border-color:var(--accent);color:var(--accent)}
  .snapshot-warning{display:none;margin:0 0 18px;padding:11px 14px;border:1px solid #e7c46a;border-radius:10px;background:#fff8e5;color:#7a5610;font:600 12px/1.45 'Spline Sans Mono',monospace}
  .lab-warning,.vol-warning{margin:0 0 18px;padding:12px 14px;border-radius:12px;font:600 12px/1.45 'Spline Sans Mono',monospace}
  .lab-warning{border:1px solid #d97706;background:#fffbeb;color:#92400e}
  .vol-warning{border:1px solid #ddd6fe;background:var(--purple-bg);color:var(--purple)}
  .view{display:none}
  .view.on{display:block}
  .equity-summary{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;margin:0 0 18px}
  .eq-card,.panel,.kpi{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
  .panel.clickable{cursor:pointer}
  .panel.clickable:hover{border-color:rgba(55,91,121,.45);box-shadow:0 12px 32px rgba(55,91,121,.12)}
  .eq-card{padding:22px 24px}
  .eq-label,.label,.panel h2{font:700 11px/1 'Spline Sans Mono',monospace;text-transform:uppercase;letter-spacing:1.2px;color:var(--ink-soft)}
  .eq-equity{font-family:'Fraunces',serif;font-size:clamp(30px,5vw,44px);font-weight:600;letter-spacing:-1px;line-height:1.05;margin-top:7px}
  .eq-growth{font:700 14px/1.4 'Spline Sans Mono',monospace;margin-top:8px}
  .split-bar{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:14px 0 12px;background:var(--line)}
  .split-bar .cash{background:linear-gradient(90deg,var(--green),#3bbd8a)}
  .split-bar .inv{background:linear-gradient(90deg,var(--accent),#5b7e9e)}
  .split-legend{display:flex;justify-content:space-between;gap:14px;font-size:12px}
  .split-legend .k{display:block;font:700 10.5px/1.2 'Spline Sans Mono',monospace;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-soft);margin-bottom:4px}
  .split-legend .v{font-weight:700;font-size:15px}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
  .kpi{padding:18px 20px;overflow:hidden}
  .kpi .value{font-family:'Fraunces',serif;font-size:clamp(23px,4vw,36px);font-weight:600;letter-spacing:-.8px;line-height:1.05;margin-top:8px;overflow-wrap:anywhere}
  .kpi .sub{font:12px/1.35 'Spline Sans Mono',monospace;color:var(--ink-soft);margin-top:8px}
  .grid{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;margin-top:18px}
  .three-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
  .panel{padding:22px}
  .panel h2{margin:0 0 16px;display:flex;align-items:center;gap:8px}
  .panel h2:before{content:'';width:6px;height:6px;border-radius:50%;background:var(--gold)}
  .panel.open-panel{border-color:#cfe8dc;background:linear-gradient(180deg,#fff,#fbfffd)}
  .panel.open-panel h2:before{background:var(--green)}
  .panel.closed-panel{border-color:#ead7d9;background:linear-gradient(180deg,#fff,#fffafa)}
  .panel.closed-panel h2:before{background:var(--red)}
  .section-note{font:12px/1.45 'Spline Sans Mono',monospace;color:var(--ink-soft);margin:-8px 0 14px}
  .exit-switch-wrap{display:flex;justify-content:center;margin:4px 0 16px}
  .exit-switch{position:relative;display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;box-shadow:var(--shadow)}
  .exit-switch .thumb{position:absolute;top:4px;left:4px;height:calc(100% - 8px);width:calc(50% - 4px);background:var(--accent);border-radius:9px;transition:transform .22s cubic-bezier(.4,0,.2,1);box-shadow:0 1px 3px rgba(58,90,120,.35)}
  .exit-switch.eod .thumb{transform:translateX(100%)}
  .exit-switch button{position:relative;z-index:1;border:none;background:transparent;font-weight:700;font-size:13px;color:var(--ink-soft);padding:9px 26px;cursor:pointer;border-radius:9px;white-space:nowrap;min-width:120px}
  .exit-switch button.on{color:#fff}
  .portfolio-toggle{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:6px;box-shadow:var(--shadow);margin:0 auto 18px;max-width:100%}
  .toggle-btn{font-size:13px;font-weight:700;color:var(--ink-soft);background:transparent;border:none;border-radius:999px;padding:8px 16px;cursor:pointer;white-space:nowrap}
  .toggle-btn.on{background:var(--accent-bg);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .toggle-btn.disabled{opacity:.4;cursor:not-allowed}
  .model-section{text-align:center;margin:20px 0 18px}
  .model-section-label{font:700 10px/1 'Spline Sans Mono',monospace;text-transform:uppercase;letter-spacing:1.8px;color:var(--ink-soft);margin-bottom:10px}
  .model-cards{display:inline-flex;gap:10px}
  .model-card{display:flex;align-items:center;gap:9px;padding:10px 20px;border-radius:14px;border:1.5px solid var(--line);background:var(--panel);cursor:pointer;transition:all .18s ease;font-weight:700;font-size:13px;color:var(--ink-soft);box-shadow:var(--shadow);position:relative}
  .model-card.on.fixed{border-color:var(--accent);background:var(--accent-bg);color:var(--accent)}
  .model-card.on.volatility{border-color:var(--purple);background:var(--purple-bg);color:var(--purple)}
  .pilot-tag{position:absolute;top:-8px;right:-6px;font:700 8px/1 'Spline Sans Mono',monospace;background:var(--purple);color:#fff;padding:3px 7px;border-radius:6px;letter-spacing:.4px}
  #active-label{text-align:center;font:12px/1.5 'Spline Sans Mono',monospace;color:var(--ink-soft);margin:12px 0 22px}
  #active-label strong{font:700 14px/1.2 'Spline Sans',sans-serif;color:var(--ink)}
  .pos-text{color:var(--green)} .neg-text{color:var(--red)} .zero-text{color:var(--ink-soft)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:none}
  .name{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .tag,.badge{font:700 10px/1 'Spline Sans Mono',monospace;padding:4px 8px;border-radius:7px;letter-spacing:.3px;border:1px solid var(--line);background:var(--accent-bg);color:var(--accent)}
  .badge.long,.badge.good{background:var(--green-bg);color:var(--green);border-color:#b8e2cc}
  .badge.short,.badge.bad{background:var(--red-bg);color:var(--red);border-color:#e8a0a8}
  .badge.vol{background:var(--purple-bg);color:var(--purple);border-color:#ddd6fe}
  .badge.warn{background:#fff8e5;color:#7a5610;border-color:#e7c46a}
  .metrics{display:flex;gap:18px;align-items:center}
  .metric{text-align:right}
  .m-val{font:700 14px/1.2 'Spline Sans Mono',monospace}
  .m-lab{font-size:10px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
  .pos-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .pos-row:hover{background:rgba(0,0,0,.025)}
  .pos-row:last-child{border-bottom:none}
  .pos-row.open{border-left:3px solid #b8e2cc;padding-left:10px;border-radius:10px}
  .pos-row.closed{align-items:start;border-left:3px solid #e8a0a8;padding-left:10px;border-radius:10px;background:rgba(251,234,236,.28);margin-bottom:4px}
  .pos-row.closed.take_profit{border-left-color:#b8e2cc;background:rgba(230,245,238,.35)}
  .pos-row.closed.time,.pos-row.closed.sell_eod{border-left-color:#bfd0dd;background:rgba(234,240,245,.42)}
  .asset-line{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pos-meta{font:12px/1.5 'Spline Sans Mono',monospace;color:var(--ink-soft);margin-top:4px}
  .reason-line{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:7px}
  .reason-pill{font:800 10px/1 'Spline Sans Mono',monospace;text-transform:uppercase;letter-spacing:.45px;padding:6px 9px;border-radius:999px;border:1px solid var(--line);background:#f7f6f0;color:var(--ink-soft)}
  .reason-pill.stop_loss{background:var(--red-bg);color:var(--red);border-color:#e8a0a8}
  .reason-pill.take_profit{background:var(--green-bg);color:var(--green);border-color:#b8e2cc}
  .reason-pill.sell_eod,.reason-pill.eod{background:var(--accent-bg);color:var(--accent);border-color:#bfd0dd}
  .article-chip{display:inline-flex;margin-top:7px;font:700 11px/1 'Spline Sans Mono',monospace;color:#2563eb}
  .spend-line{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin-top:8px;padding:10px 12px;border-radius:12px;background:#fbfaf6;border:1px solid var(--line)}
  .spend-label{font:800 10px/1 'Spline Sans Mono',monospace;text-transform:uppercase;letter-spacing:.7px;color:var(--ink-soft)}
  .spend-value{font:800 18px/1 'Fraunces',serif;color:var(--ink)}
  .rule-chip{font:800 10px/1 'Spline Sans Mono',monospace;text-transform:uppercase;letter-spacing:.45px;padding:6px 8px;border-radius:999px;border:1px solid #b8e2cc;background:var(--green-bg);color:var(--green);white-space:nowrap}
  .rule-chip.warn{border-color:#e7c46a;background:#fff8e5;color:#7a5610}
  .compact-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}
  .pos-pnl{text-align:right;font-weight:800}
  .mini-track{height:10px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:9px;display:grid;grid-template-columns:1fr 1fr;position:relative}
  .mini-track .loss-zone{background:linear-gradient(90deg,#f8c8ce,var(--red-bg))}
  .mini-track .target-zone{background:linear-gradient(90deg,var(--green-bg),#b9ead0)}
  .mini-track .price-dot{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;background:var(--ink);border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.25);transform:translate(-50%,-50%)}
  .mini-track-labels{display:flex;justify-content:space-between;gap:8px;margin-top:4px;font:700 9.5px/1.2 'Spline Sans Mono',monospace;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.45px}
  .mini-track-labels .loss{color:var(--red)}
  .mini-track-labels .target{color:var(--green)}
  .guardrail-track{height:12px;background:var(--line);border-radius:999px;overflow:hidden;margin:9px 0 4px}
  .guardrail-track span{display:block;height:100%;border-radius:999px;min-width:0}
  .guardrail-track.target span{background:linear-gradient(90deg,#6ee7b7,var(--green))}
  .guardrail-track.loss span{background:linear-gradient(90deg,#fca5a5,var(--red))}
  .guardrail-caption{display:flex;justify-content:space-between;gap:12px;font:700 10.5px/1.35 'Spline Sans Mono',monospace;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
  .account-guard{border:1px solid var(--line);border-radius:14px;background:#fbfaf6;padding:14px;margin:12px 0}
  .account-guard-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
  .account-guard-title{font-weight:800}
  .account-guard-status{font:800 10px/1 'Spline Sans Mono',monospace;text-transform:uppercase;letter-spacing:.5px;border:1px solid #b8e2cc;background:var(--green-bg);color:var(--green);border-radius:999px;padding:6px 8px}
  .account-guard-status.bad{border-color:#e8a0a8;background:var(--red-bg);color:var(--red)}
  .guard-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
  .guard-mini{border:1px solid rgba(35,31,26,.08);border-radius:10px;background:rgba(255,255,255,.62);padding:9px}
  .guard-mini strong{display:block;font:800 17px/1.1 'Fraunces',serif}
  .guard-mini span{font:700 9.5px/1.3 'Spline Sans Mono',monospace;text-transform:uppercase;color:var(--ink-soft);letter-spacing:.45px}
  .target-health{border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 18px;background:#fbfaf6}
  .target-health.warn{background:#fff8e5;border-color:#e7c46a}
  .target-health.bad{background:var(--red-bg);border-color:#e8a0a8}
  .target-health.good{background:var(--green-bg);border-color:#b8e2cc}
  .target-health-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .target-health-title{font-weight:800}
  .target-health-rate{font:800 22px/1 'Fraunces',serif}
  .target-health-sample{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:12px}
  .target-health-sample span{border:1px solid rgba(35,31,26,.08);background:rgba(255,255,255,.58);border-radius:10px;padding:8px 9px;font:700 11px/1.25 'Spline Sans Mono',monospace;text-transform:uppercase;color:var(--ink-soft)}
  .target-health-sample strong{display:block;color:var(--ink);font:800 17px/1.1 'Fraunces',serif;text-transform:none;margin-bottom:2px}
  .target-health-bars{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
  .target-health-bars span{height:8px;border-radius:999px;background:var(--line);display:block}
  .target-health-bars .tp{background:var(--green)}
  .target-health-bars .sl{background:var(--red)}
  .target-health-bars .time{background:var(--accent)}
  .ops-details{margin-top:18px;border:1px solid var(--line);border-radius:14px;background:#fbfaf6;overflow:hidden}
  .ops-details summary{cursor:pointer;padding:14px 16px;font:800 11px/1 'Spline Sans Mono',monospace;text-transform:uppercase;letter-spacing:.7px;color:var(--ink-soft);list-style:none}
  .ops-details summary::-webkit-details-marker{display:none}
  .ops-details-body{padding:0 16px 16px}
  .closed-toggle{background:none;border:1px solid var(--line);border-radius:10px;padding:10px 16px;width:100%;text-align:left;cursor:pointer;font-weight:700;font-size:13px;color:var(--ink-soft);margin:12px 0 10px;display:flex;justify-content:space-between;align-items:center}
  .trade-search{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;font-size:13px;margin-bottom:10px;outline:none;background:var(--bg)}
  .empty{padding:18px;border:1px dashed var(--line);border-radius:12px;color:var(--ink-soft);font:13px/1.5 'Spline Sans Mono',monospace;background:rgba(255,255,255,.45)}
  .cand-card{padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--panel);box-shadow:var(--shadow);margin-bottom:10px}
  .cand-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .cand-asset{font:700 16px/1.2 'Spline Sans',sans-serif}
  .cand-status{font:800 10px/1 'Spline Sans Mono',monospace;padding:5px 9px;border-radius:999px;letter-spacing:.4px;text-transform:uppercase}
  .cand-status.candidate{background:#fff8e5;color:#7a5610;border:1px solid #e7c46a}
  .cand-status.opened{background:var(--green-bg);color:var(--green);border:1px solid #b8e2cc}
  .cand-status.rejected{background:var(--red-bg);color:var(--red);border:1px solid #e8a0a8}
  .cand-status.pending_trade{background:var(--accent-bg);color:var(--accent);border:1px solid #bfd0dd}
  .cand-status.closed{background:#f7f6f0;color:var(--ink-soft);border:1px solid var(--line)}
  .cand-headline{font:13px/1.45 'Spline Sans',sans-serif;color:var(--ink-soft);margin:8px 0 6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .cand-meta{display:flex;flex-wrap:wrap;gap:6px 14px;font:500 11px/1.4 'Spline Sans Mono',monospace;color:var(--ink-soft)}
  .cand-meta strong{color:var(--ink);font-weight:700}
  .cand-link{display:inline-block;margin-top:8px;font:700 11px/1 'Spline Sans Mono',monospace;color:#2563eb}
  .conf-row{padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--panel);margin-bottom:10px}
  .conf-row.conf-small{opacity:.65;border-style:dashed}
  .conf-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  .conf-bucket{font:700 15px/1 'Spline Sans',sans-serif}
  .conf-warn{font:600 10px/1 'Spline Sans Mono',monospace;color:var(--gold);text-transform:uppercase;letter-spacing:.5px}
  .lat-card{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:8px}
  .lat-head{font:700 14px/1.2 'Spline Sans',sans-serif;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .lat-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px;margin-top:8px}
  .lat-metric{font:500 11px/1.4 'Spline Sans Mono',monospace;color:var(--ink-soft)}
  .lat-metric strong{display:block;font:700 14px/1.2 'Spline Sans',sans-serif;color:var(--ink)}
  .lat-ref{font:500 10px/1.3 'Spline Sans Mono',monospace;color:var(--ink-soft);margin-top:4px;font-style:italic}
  .lat-row,.signal-row,.x-row{padding:12px 0;border-bottom:1px solid var(--line)}
  .lat-row:last-child,.signal-row:last-child,.x-row:last-child{border-bottom:none}
  .headline{font-weight:700;line-height:1.35}
  .small{font:12px/1.45 'Spline Sans Mono',monospace;color:var(--ink-soft)}
  .tm-overlay{position:fixed;inset:0;background:rgba(20,22,28,.55);display:none;align-items:flex-start;justify-content:center;z-index:9999;overflow-y:auto;padding:40px 16px}
  .tm-overlay.open{display:flex}
  .tm-modal{background:var(--panel);border-radius:16px;max-width:720px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.28);overflow:hidden}
  .tm-head{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}

  .path-bar{height:16px;border-radius:999px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;position:relative;margin:10px 0 8px;border:1px solid var(--line)}
  .path-bar .loss-zone{background:linear-gradient(90deg,#f8c8ce,var(--red-bg))}

  .path-bar .price-dot{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:var(--ink);border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.25);transform:translate(-50%,-50%)}
  .path-labels{display:flex;justify-content:space-between;gap:8px;font:700 10px/1.3 'Spline Sans Mono',monospace;color:var(--ink-soft)}
  .tm-pnl-banner{margin:0 0 16px;padding:14px 16px;border-radius:12px;text-align:center;font-size:24px;font-weight:800}

  .tm-foot{padding:14px 24px;border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap}

  @media(max-width:760px){

  .vol-reject-tag{display:inline-flex;align-items:center;gap:4px;font:600 9.5px/1 'Spline Sans Mono',monospace;padding:3px 7px;border-radius:6px;background:#fff8e5;color:#7a5610;border:1px solid #e7c46a;letter-spacing:.2px;white-space:nowrap}
  .atr-info-tag{display:inline-flex;align-items:center;gap:4px;font:600 9.5px/1 'Spline Sans Mono',monospace;padding:3px 7px;border-radius:6px;background:var(--purple-bg);color:var(--purple);border:1px solid #ddd6fe;letter-spacing:.2px;white-space:nowrap}
  .expansion-panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px 22px;margin-bottom:18px}
  .expansion-panel h2{margin:0 0 14px;font:700 11px/1 'Spline Sans Mono',monospace;text-transform:uppercase;letter-spacing:1.2px;color:var(--ink-soft);display:flex;align-items:center;gap:8px}
  .expansion-panel h2:before{content:'';width:6px;height:6px;border-radius:50%;background:var(--gold)}
  .expansion-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .expansion-stat{text-align:center}
  .expansion-stat .exp-label{font:700 9.5px/1 'Spline Sans Mono',monospace;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-soft);margin-bottom:6px}
  .expansion-stat .exp-value{font:700 16px/1.2 'Spline Sans',sans-serif}
  .expansion-badge{display:inline-block;margin-top:12px;font:700 11px/1 'Spline Sans Mono',monospace;padding:8px 16px;border-radius:10px;letter-spacing:.5px;text-transform:uppercase}
  .expansion-badge.ready{background:linear-gradient(135deg,var(--green-bg),#fdf6e3);color:var(--green);border:1.5px solid var(--green);box-shadow:0 0 0 3px rgba(29,157,107,.08)}

<body>

<div class="tm-overlay" id="tm-overlay" onclick="if(event.target===this)closeTradeModal()">
  <div class="tm-modal" id="tm-modal" role="dialog" aria-modal="true" aria-label="Trade details"></div>
</div>

<script>
let DATA=null;
let CURRENT_VIEW=localStorage.getItem('v2_old_view') || 'operations';
let sel={
  portfolio:localStorage.getItem('v2_old_portfolio') || 'news_only',
  lifecycle:localStorage.getItem('v2_old_lifecycle') || 'hold_24hr',
  model:localStorage.getItem('v2_old_model') || 'fixed'
};
let OPEN_EXPANDED=false, CLOSED_EXPANDED=false;
let OPEN_SEARCH='', CLOSED_SEARCH='';
let CURRENT_TRADE_ID=null;
const VOL_PILOT1_START_AT='2026-06-19T00:50:22.324742+00:00';

const STRAT_LABELS={news_only:'News Only',news_plus_ta:'Trend Gate',mean_reversion:'Mean Revert',trend_strict:'Trend Strict',full_confluence:'Full Confluence',crypto_lab:'Crypto Lab'};
const LIFE_LABELS={hold_24hr:'24hr Hold',sell_eod:'Early Exit'};
const fmtMoney=n=>'$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtPrice=n=>n==null?'—':'$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:Math.abs(Number(n))<1?4:2,maximumFractionDigits:Math.abs(Number(n))<1?4:2});
const fmtPct=n=>(Number(n||0)>0?'+':'')+Number(n||0).toFixed(2)+'%';
const fmtInt=n=>Number(n||0).toLocaleString('en-US');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const signCls=n=>Number(n||0)>0?'pos-text':(Number(n||0)<0?'neg-text':'zero-text');
const shortTime=iso=>iso?new Date(iso).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'—';
const secondsLabel=s=>s==null?'—':(Math.abs(Number(s))<60?Math.round(Number(s))+'s':Math.round(Number(s)/60)+'m');
const timeAgo=ts=>{if(!ts)return'—';const d=Date.now()-new Date(ts).getTime();if(d<0)return'just now';if(d<60000)return'<1m ago';if(d<3600000)return Math.floor(d/60000)+'m ago';if(d<86400000)return Math.floor(d/3600000)+'h ago';return Math.floor(d/86400000)+'d ago'};
const refLabel=src=>src==='news_time_quote'?'Move since news':src==='candidate_observed_price'?'Move since first seen':'Reference price missing';
const rows=a=>Array.isArray(a)?a:[];
const officialBooks=()=>rows(DATA?.official_books).length?rows(DATA.official_books):rows(DATA?.prop_books).length?rows(DATA.prop_books):rows(DATA?.book_metrics);
const openPositions=()=>rows(DATA?.open_positions);
const closedTrades=()=>rows(DATA?.closed_trades);
const allTrades=()=>openPositions().concat(closedTrades());
function bookLabel(b){return `${STRAT_LABELS[b?.portfolio]||b?.portfolio||'Book'} · ${LIFE_LABELS[b?.lifecycle]||b?.lifecycle||'Lifecycle'} · ${(b?.target_model||'model')}`;}
function selectedBook(){return officialBooks().find(b=>(b.portfolio||'')===sel.portfolio && (b.lifecycle||'')===sel.lifecycle && (b.target_model||b.classification||'')===sel.model)}
function modelOf(r){return r.target_model||r.model||r.classification||'fixed'}
function tradeTs(t){return new Date(t.entry_time||t.created_at||t.opened_at||t.exit_time||0).getTime()}
function currentPilotTrade(t){return modelOf(t)!=='volatility' || tradeTs(t)>=new Date(VOL_PILOT1_START_AT).getTime()}
function selectedBookTrades(b,status){
  const source=status==='OPEN'?openPositions():closedTrades();
  return source.filter(t=>t.book_key===b.book_key).filter(currentPilotTrade);
}
function pnlOf(t){return t.status==='CLOSED' ? Number(t.realized_pnl||0) : Number(t.computed_unrealized_pnl ?? t.unrealized_pnl ?? 0)}
function pctOf(t){return t.status==='CLOSED' ? Number(t.computed_realized_pnl_pct ?? (Number(t.realized_pnl_percent||0)*100)) : Number(t.computed_unrealized_pnl_pct ?? (Number(t.unrealized_pnl_percent||0)*100))}
function brokerLabel(s){return s==='paper_filled'?'Broker: paper filled':s==='submitted'?'Broker: submitted':s==='cancelled'?'Broker: cancelled':'Broker: not mirrored'}
function articleUrl(t){
  const sig=rows(DATA?.signals).find(s=>s.id===t.signal_id);
  return t.news_url || t.source_url || sig?.news_url || sig?.raw_payload?.source_url || t.raw_payload?.source_url || null;
}
function exitReasonLabel(reason){
  const r=String(reason||'').toLowerCase();
  if(!r||r==='null') return 'Close reason pending';
  if(r.includes('stop')) return 'Closed: stop loss';
  if(r.includes('profit')||r.includes('target')) return 'Closed: take profit';
  if(r.includes('eod')||r.includes('end')) return 'Closed: end of day';
  if(r.includes('manual')) return 'Closed: manual';
  return 'Closed: '+r.replaceAll('_',' ');
}
function exitReasonClass(reason){
  const r=String(reason||'').toLowerCase();
  if(r.includes('stop')) return 'stop_loss';
  if(r.includes('profit')||r.includes('target')) return 'take_profit';
  if(r.includes('eod')||r.includes('end')) return 'sell_eod';
  if(r.includes('time')) return 'time';
  return '';
}
function pricePathValue(t){
  const px=t.status==='CLOSED'?(t.exit_price??t.current_price):t.current_price;
  if(px==null || t.stop_loss_price==null || t.take_profit_price==null || t.entry_price==null) return 50;
  const low=Math.min(Number(t.stop_loss_price),Number(t.take_profit_price));
  const high=Math.max(Number(t.stop_loss_price),Number(t.take_profit_price));
  if(!Number.isFinite(low)||!Number.isFinite(high)||high===low) return 50;
  return Math.max(0,Math.min(100,((Number(px)-low)/(high-low))*100));
}
function pricePathBar(t, compact=false){
  if(t.stop_loss_price==null || t.take_profit_price==null) return '';
  const pos=pricePathValue(t);
  const lossLabel=`SL ${fmtPrice(t.stop_loss_price)}`;
  const targetLabel=`TP ${fmtPrice(t.take_profit_price)}`;
  const left=Number(t.stop_loss_price)<Number(t.take_profit_price)?lossLabel:targetLabel;
  const right=Number(t.stop_loss_price)<Number(t.take_profit_price)?targetLabel:lossLabel;
  const leftCls=Number(t.stop_loss_price)<Number(t.take_profit_price)?'loss':'target';
  const rightCls=Number(t.stop_loss_price)<Number(t.take_profit_price)?'target':'loss';
  const klass=compact?'mini-track':'path-bar';
  const labels=compact?'mini-track-labels':'path-labels';
  return `<div class="${klass}"><span class="loss-zone"></span><span class="target-zone"></span><i class="price-dot" style="left:${pos}%"></i></div><div class="${labels}"><span class="${leftCls}">${esc(left)}</span><span class="${rightCls}">${esc(right)}</span></div>`;
}
function tradeHigh(t){return t.high_price ?? t.high_since_entry ?? t.max_price ?? t.session_high ?? null}
function tradeLow(t){return t.low_price ?? t.low_since_entry ?? t.min_price ?? t.session_low ?? null}
function latencyFor(t){return rows(DATA?.latency).find(l=>l.v2_trade_intent_id===t.id || (l.signal_id===t.signal_id && l.asset===t.asset))}
function latencyReferencePrice(l){return l?.news_reference_price ?? l?.price_at_news ?? null}
function latencyRawMove(l){return l?.price_move_before_entry_pct ?? null}
function latencyAdjustedMove(l){return l?.direction_adjusted_move_before_entry_pct ?? latencyRawMove(l)}
function latencySourceText(l){return String(l?.price_reference_source||l?.latency_price_status||'').replaceAll('_',' ') || 'not captured yet'}
function bookForTrade(t){return officialBooks().find(b=>b.book_key===t.book_key || b.book_id===t.book_id)}
function spendRuleInfo(t){
  const spent=Number(t.stake_amount||0);
  const book=bookForTrade(t);
  const base=Number(t.pre_trade_free_cash ?? t.available_cash_before_trade ?? book?.starting_balance ?? t.book_starting_balance ?? 0);
  const pct=base>0?(spent/base)*100:null;
  const exact=t.pre_trade_free_cash!=null || t.available_cash_before_trade!=null;
  const ok=pct!=null && Math.abs(pct-10)<=1.25;
  return {spent, pct, exact, ok};
}
function targetStats(trades){
  const closed=trades.filter(t=>t.status==='CLOSED');
  const open=trades.filter(t=>t.status==='OPEN');
  const tp=closed.filter(t=>exitReasonClass(t.exit_reason)==='take_profit').length;
  const sl=closed.filter(t=>exitReasonClass(t.exit_reason)==='stop_loss').length;
  const timed=closed.filter(t=>['time','sell_eod'].includes(exitReasonClass(t.exit_reason))).length;
  const rate=closed.length?tp/closed.length*100:0;
  const realized=closed.reduce((sum,t)=>sum+Number(t.realized_pnl||0),0);
  const unrealized=open.reduce((sum,t)=>sum+Number(t.unrealized_pnl||0),0);
  return {closed:closed.length,open:open.length,tp,sl,timed,rate,realized,unrealized};
}
function targetHealthPanel(trades, model){
  const s=targetStats(trades);
  if(!s.closed) return `<div class="target-health"><div class="target-health-top"><div><div class="target-health-title">Target feedback</div><div class="small">${fmtInt(s.open)} open positions. No closed trades yet for this selected book.</div></div><div class="target-health-rate">—</div></div></div>`;
  const cls=s.rate>=35?'good':s.rate>=15?'warn':'bad';
  const note=s.rate===0
    ? 'No take-profits yet. Watch whether the target is too far for this model.'
    : s.rate<20
      ? 'Low take-profit rate. Review target distance before expanding this model.'
      : 'Take-profits are showing up; keep monitoring sample size.';
  const modelNote=model==='volatility' && s.tp===0 ? ' Volatility target may need review after a larger sample.' : '';
  return `<div class="target-health ${cls}">
    <div class="target-health-top"><div><div class="target-health-title">Target feedback</div><div class="small">${esc(note+modelNote)}</div></div><div class="target-health-rate">${s.rate.toFixed(0)}%</div></div>
    <div class="target-health-sample">
      <span><strong>${fmtInt(s.open)}</strong> open</span>
      <span><strong>${fmtInt(s.closed)}</strong> closed</span>
      <span class="${signCls(s.unrealized)}">${Number(s.unrealized)>=0?'+':''}${fmtMoney(s.unrealized)} open P/L</span>
      <span class="${signCls(s.realized)}">${Number(s.realized)>=0?'+':''}${fmtMoney(s.realized)} realized</span>
    </div>
    <div class="target-health-bars"><span class="tp" style="opacity:${s.tp?s.tp/s.closed:.08}"></span><span class="sl" style="opacity:${s.sl?s.sl/s.closed:.08}"></span><span class="time" style="opacity:${s.timed?s.timed/s.closed:.08}"></span></div>
    <div class="guardrail-caption"><span>${fmtInt(s.tp)} TP</span><span>${fmtInt(s.sl)} SL</span><span>${fmtInt(s.timed)} time</span></div>
  </div>`;
}
function modelPerformancePanel(){
  const vr=DATA?.volatility_review||[];
  const vrMap={};
  vr.forEach(r=>{vrMap[r.target_model]=r});
  const rows=['fixed','volatility'].map(model=>{
    const db=vrMap[model];
    if(db){
      const timed=(db.other_exits||0);
      return {model,open:db.open_count,closed:db.closed_count,tp:db.tp_hits,sl:db.sl_hits,timed,
        realized:db.realized_pnl,unrealized:db.unrealized_pnl,tpRate:db.tp_hit_rate_pct||0,slRate:db.sl_hit_rate_pct||0,
        status:db.review_status,atr:db.avg_atr_percent,stopPct:db.avg_stop_pct,targetPct:db.avg_target_pct};
    }
    const trades=allTrades();
    const rs=trades.filter(t=>modelOf(t)===model);
    const open=rs.filter(t=>t.status==='OPEN');
    const closed=rs.filter(t=>t.status==='CLOSED');
    const tp=closed.filter(t=>exitReasonClass(t.exit_reason)==='take_profit').length;
    const sl=closed.filter(t=>exitReasonClass(t.exit_reason)==='stop_loss').length;
    const timed=closed.filter(t=>['time','sell_eod'].includes(exitReasonClass(t.exit_reason))).length;
    const realized=closed.reduce((sum,t)=>sum+Number(t.realized_pnl||0),0);
    const unrealized=open.reduce((sum,t)=>sum+Number(t.unrealized_pnl||0),0);
    const tpRate=closed.length?tp/closed.length*100:0;
    return {model,open:open.length,closed:closed.length,tp,sl,timed,realized,unrealized,tpRate,slRate:0,status:'',atr:null,stopPct:null,targetPct:null};
  });
  const statusLabel=s=>({collecting_evidence:'Collecting evidence',review_target_distance:'Review target distance',underperforming:'Underperforming',ok:'On track'}[s]||s||'');
  const cards=rows.map(r=>{
    const sampleGoal=r.model==='volatility'?30:40;
    const sampleLabel=r.model==='volatility'?'Sample progress':'Closed sample';
    const sampleColor=r.model==='volatility'?'var(--purple)':'var(--green)';
    const sampleBar=`<div style="margin:10px 0 4px"><div style="display:flex;justify-content:space-between;font:600 11px/1 'Spline Sans Mono',monospace;color:var(--ink-soft)"><span>${sampleLabel}</span><span>${fmtInt(r.closed)} / ${sampleGoal} closed</span></div><div style="height:6px;border-radius:3px;background:var(--line);margin-top:5px;overflow:hidden"><div style="height:100%;border-radius:3px;background:${sampleColor};width:${Math.min(100,r.closed/sampleGoal*100)}%"></div></div></div>`;

function freshness(){
  const gen=DATA?.generated_at; if(!gen) return;
  const age=Math.max(0,Math.round((Date.now()-new Date(gen).getTime())/60000));
  document.getElementById('upd-date').textContent=new Date(gen).toLocaleString();
  const upd=document.querySelector('.updated');
  if(upd){upd.classList.remove('fresh','warn','stale');upd.classList.add(age<=10?'fresh':age<=20?'warn':'stale')}
  const warn=document.getElementById('snapshot-warning');
  if(age>20){warn.style.display='block'; warn.textContent=`Data is ${age}m old. Pull/refresh if publisher has not updated yet.`}
  else {warn.style.display='none'}

function equityBlock(summary){

      <div>
        <div class="tm-section"><h4>Volatility Model</h4>${kv('Model source',t.target_source||t.atr_source||'—')}${kv('ATR source',t.atr_source||t.target_source||'—')}${kv('ATR timestamp',t.atr_source_timestamp?shortTime(t.atr_source_timestamp):'—')}${kv('ATR value',t.atr_value??'—')}${kv('ATR percent',t.atr_percent==null?'—':fmtPct(t.atr_percent))}${kv('Vol stop',t.volatility_stop_percent==null?'—':fmtPct(t.volatility_stop_percent))}${kv('Vol target',t.volatility_target_percent==null?'—':fmtPct(t.volatility_target_percent))}</div>
        <div class="tm-section"><h4>Timing</h4>${kv('News to trade',secondsLabel(lat?.news_to_trade_seconds))}${kv('Reference price',refPx==null?'Not captured yet':fmtPrice(refPx))}${kv('Reference source',latencySourceText(lat))}${kv('Raw move before entry',rawMove==null?'Not captured yet':fmtPct(rawMove))}${kv('Direction-adjusted move',adjMove==null?'Not captured yet':fmtPct(adjMove))}${kv('Entry time',shortTime(t.entry_time))}${closed?kv('Exit time',shortTime(t.exit_time)):''}</div>
      </div>
    </div>
    <div class="tm-section"><h4>News</h4><div class="small">${esc(lat?.headline || rows(DATA?.signals).find(s=>s.id===t.signal_id)?.headline || 'No headline available')}</div></div>
  </div>
  <div class="tm-foot"><button class="tm-btn" onclick="openTradeModal('${esc(prevId)}')">← Previous trade</button><button class="tm-btn" onclick="openTradeModal('${esc(nextId)}')">Next trade →</button><button class="tm-btn" onclick="closeTradeModal()">Close</button></div>`;
  document.getElementById('tm-modal').innerHTML=html;
  document.getElementById('tm-overlay').classList.add('open');
}
function kv(k,v){return `<div class="tm-kv"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`}
function closeTradeModal(){document.getElementById('tm-overlay').classList.remove('open')}
function bind(){
  document.querySelectorAll('.nav-link').forEach(b=>b.onclick=()=>showView(b.dataset.view));
  document.getElementById('nav-current').onclick=()=>document.getElementById('site-nav').classList.toggle('open');
  document.getElementById('refresh-btn').onclick=()=>load();
  document.getElementById('exit-switch').onclick=e=>{const b=e.target.closest('button'); if(!b) return; sel.lifecycle=b.dataset.rule; localStorage.setItem('v2_old_lifecycle',sel.lifecycle); renderOperations()};
  document.getElementById('model-cards').onclick=e=>{const b=e.target.closest('button'); if(!b) return; sel.model=b.dataset.model; localStorage.setItem('v2_old_model',sel.model); renderOperations()};
  document.addEventListener('click',e=>{
    const p=e.target.closest('[data-portfolio]'); if(p){sel.portfolio=p.dataset.portfolio; localStorage.setItem('v2_old_portfolio',sel.portfolio); renderOperations(); return}
    const tr=e.target.closest('[data-trade-id]'); if(tr){openTradeModal(tr.dataset.tradeId); return}
    if(e.target.closest('#toggle-open')){OPEN_EXPANDED=!OPEN_EXPANDED; renderOperations(); return}
    if(e.target.closest('#toggle-closed')){CLOSED_EXPANDED=!CLOSED_EXPANDED; renderOperations(); return}
  });
  document.addEventListener('input',e=>{if(e.target.id==='open-search'){OPEN_SEARCH=e.target.value; renderOperations()} if(e.target.id==='closed-search'){CLOSED_SEARCH=e.target.value; renderOperations()}});
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape') closeTradeModal();
    if(!document.getElementById('tm-overlay').classList.contains('open')) return;
    const list=allTrades();
    const idx=list.findIndex(x=>String(x.id)===String(CURRENT_TRADE_ID));
    if(idx<0||!list.length) return;
    if(e.key==='ArrowLeft') openTradeModal(list[(idx-1+list.length)%list.length].id);
    if(e.key==='ArrowRight') openTradeModal(list[(idx+1)%list.length].id);
  });
}
function ensureValidSelection(){
  const books=officialBooks();
  if(!books.length) return;
  if(!books.some(b=>b.portfolio===sel.portfolio)) sel.portfolio=books[0].portfolio;
  if(!books.some(b=>b.portfolio===sel.portfolio && b.lifecycle===sel.lifecycle)) sel.lifecycle=books.find(b=>b.portfolio===sel.portfolio)?.lifecycle||'hold_24hr';
  if(!books.some(b=>b.portfolio===sel.portfolio && b.lifecycle===sel.lifecycle && b.target_model===sel.model)) sel.model=books.find(b=>b.portfolio===sel.portfolio && b.lifecycle===sel.lifecycle)?.target_model||'fixed';
}
function renderAll(){
  freshness(); ensureValidSelection(); renderOverview(); renderGuardrails(); renderResearch(); renderCryptoLab(); renderOperations(); showView(CURRENT_VIEW);
}
async function load(){
  const res=await fetch('data.v2.json?ts='+Date.now(),{cache:'no-store'});
  if(!res.ok) throw new Error('Failed to load data.v2.json');
  DATA=await res.json();
  renderAll();
}
bind();
load().catch(err=>{
  document.getElementById('operations-content').innerHTML=`<div class="empty">Could not load data.v2.json: ${esc(err.message)}</div>`;
});
setInterval(()=>load().catch(()=>{}),60000);
</script>
</body>
</html>
